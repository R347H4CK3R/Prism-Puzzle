name: Verify and build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test && npm run sync && git diff --exit-code web/bundle.js android/app/src/main/assets ios/PrismPuzzle/Web
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8080 --directory web &
      - run: node tests/ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Prism-Puzzle-UI-evidence
          path: docs/prism-phone.png
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Puzzle-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: xcodebuild -project ios/PrismPuzzle.xcodeproj -scheme PrismPuzzle -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: mkdir -p package/Payload && cp -R build/Build/Products/Release-iphoneos/PrismPuzzle.app package/Payload/ && cd package && zip -qr ../Prism-Puzzle-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Puzzle-iOS-unsigned
          path: Prism-Puzzle-unsigned.ipa
