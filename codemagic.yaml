# Manual-only iOS candidate; Android remains paused.
workflows:
  prism-ios-candidate:
    name: PrismPuzzle verified iOS candidate
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: '26.2'
      node: '22'
    scripts:
      - name: Verify and package iOS only
        script: bash scripts/verify-ios-candidate.sh
    artifacts:
      - cm-output/verified/*
      - cm-output/diagnostics/**

  prism-ios-visual-diagnostic:
    name: Prism iOS cube visual diagnostic
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: '26.2'
      node: '22'
    scripts:
      - name: Capture browser and native cube evidence
        script: bash scripts/visual-diagnostic.sh
    artifacts:
      - cm-output/diagnostics/**
