name: PrismPuzzle
options:
  bundleIdPrefix: com.prismpuzzle
  deploymentTarget:
    iOS: '15.0'
targets:
  PrismPuzzle:
    type: application
    platform: iOS
    sources:
      - path: PrismPuzzle/App.swift
      - path: PrismPuzzle/Web
        type: folder
      - path: PrismPuzzle/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prismpuzzle.app
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Prism Puzzle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
