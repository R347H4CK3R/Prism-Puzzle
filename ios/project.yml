name: PrismPuzzle
options:
  bundleIdPrefix: com.prismpuzzle
  deploymentTarget:
    iOS: '15.0'
targets:
  PrismPuzzle:
    type: application
    platform: iOS
    sources:
      - path: PrismPuzzle/App.swift
      - path: PrismPuzzle/Web
        type: folder
      - path: PrismPuzzle/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prismpuzzle.app
        MARKETING_VERSION: 1.1.1
        CURRENT_PROJECT_VERSION: 4
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Prism Puzzle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PrismPuzzleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PrismPuzzleUITests
    dependencies:
      - target: PrismPuzzle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prismpuzzle.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TEST_TARGET_NAME: PrismPuzzle
schemes:
  PrismPuzzle:
    build:
      targets:
        PrismPuzzle: all
    test:
      targets:
        - PrismPuzzleUITests

