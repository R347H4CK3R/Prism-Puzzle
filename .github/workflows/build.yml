name: Verify iOS candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-candidate:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all iOS candidate gates
        run: bash scripts/verify-ios-candidate.sh
      - name: Preserve private diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-ios-diagnostics
          path: cm-output/diagnostics/
          if-no-files-found: ignore
      - name: Preserve verified private candidate
        uses: actions/upload-artifact@v4
        with:
          name: prism-ios-verified
          path: cm-output/verified/
          if-no-files-found: error
